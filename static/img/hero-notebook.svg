<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="50" y1="20" x2="370" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="110" y1="60" x2="310" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Soft background blob -->
  <ellipse cx="210" cy="145" rx="175" ry="110" fill="url(#bgGlow)"/>
  <circle cx="75" cy="70" r="18" fill="#A5B4FC" fill-opacity="0.3"/>
  <circle cx="355" cy="210" r="24" fill="#67E8F9" fill-opacity="0.25"/>

  <!-- Laptop Screen Outer -->
  <rect x="105" y="52" width="210" height="138" rx="12" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="113" y="60" width="194" height="122" rx="6" fill="url(#screenGrad)"/>
  <circle cx="210" cy="56" r="2" fill="#94A3B8"/>

  <!-- Screen UI Elements (Calendar / Schedule) -->
  <rect x="127" y="74" width="105" height="12" rx="4" fill="#6366F1" fill-opacity="0.4"/>
  <rect x="127" y="94" width="75" height="8" rx="3" fill="#94A3B8" fill-opacity="0.35"/>

  <!-- Schedule Cards Inside Screen -->
  <rect x="127" y="112" width="166" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.1"/>
  <circle cx="140" cy="124" r="5" fill="#38BDF8"/>
  <rect x="152" y="120" width="80" height="7" rx="3" fill="#E2E8F0"/>
  <rect x="252" y="118" width="32" height="11" rx="5.5" fill="#0284C7" fill-opacity="0.6"/>

  <rect x="127" y="143" width="166" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.1"/>
  <circle cx="140" cy="155" r="5" fill="#34D399"/>
  <rect x="152" y="151" width="95" height="7" rx="3" fill="#E2E8F0"/>
  <rect x="252" y="149" width="32" height="11" rx="5.5" fill="#059669" fill-opacity="0.6"/>

  <!-- Laptop Base -->
  <path d="M75 190H345L360 204C362 206 360.5 210 357 210H63C59.5 210 58 206 60 204L75 190Z" fill="#CBD5E1"/>
  <path d="M75 190H345L349 195H71L75 190Z" fill="#94A3B8"/>
  <rect x="182" y="192" width="56" height="4" rx="2" fill="#64748B"/>

  <!-- Floating Calendar Card (Left) -->
  <g transform="translate(42, 92)">
    <rect width="84" height="78" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M0 14C0 6.26801 6.26801 0 14 0H70C77.732 0 84 6.26801 84 14V24H0V14Z" fill="url(#accentGrad)"/>
    <circle cx="24" cy="12" r="3" fill="#FFFFFF"/>
    <circle cx="60" cy="12" r="3" fill="#FFFFFF"/>
    <rect x="14" y="34" width="14" height="10" rx="3" fill="#E0E7FF"/>
    <rect x="35" y="34" width="14" height="10" rx="3" fill="#4F46E5"/>
    <rect x="56" y="34" width="14" height="10" rx="3" fill="#E0E7FF"/>
    <rect x="14" y="52" width="14" height="10" rx="3" fill="#E0E7FF"/>
    <rect x="35" y="52" width="14" height="10" rx="3" fill="#E0E7FF"/>
    <rect x="56" y="52" width="14" height="10" rx="3" fill="#DBEAFE"/>
  </g>

  <!-- Floating Check Badge (Right) -->
  <g transform="translate(298, 66)">
    <rect width="78" height="58" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="26" cy="29" r="14" fill="#DCFCE7"/>
    <path d="M20 29L24 33L32 25" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="21" width="22" height="6" rx="3" fill="#334155"/>
    <rect x="46" y="31" width="16" height="5" rx="2.5" fill="#94A3B8"/>
  </g>
</svg>
